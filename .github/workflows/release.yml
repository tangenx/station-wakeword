name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version for a manual build (artifacts only, no release)"
        default: dev

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # v0.1.0 -> 0.1.0: yam and the registry expect bare semver, release
      # files are named after the tag.
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numpy (negatives builder)
        run: pip install numpy

      # negatives.bin is ~17 MB fetched by byte ranges from Hugging Face; it
      # only changes when the builder does.
      - uses: actions/cache@v4
        with:
          path: dist/negatives.bin
          key: negatives-${{ hashFiles('tools/build_negatives.py') }}

      - name: Test
        run: go test ./...

      # package.sh builds the .yampkg with the official aarch64 yam binary
      # under Docker qemu, installs it into a throwaway root and runs doctor.
      - name: Package (.yampkg + install bundle)
        run: |
          VERSION="${VERSION#v}"
          sh package.sh "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: wakeword-${{ env.VERSION }}
          path: |
            dist/wakeword-*.yampkg
            dist/wakeword-*.tar.gz

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wakeword-*.yampkg
            dist/wakeword-*.tar.gz
          body: |
            Свои слова активации для Яндекс Станции: слово записывается
            микрофонами станции и обучается на ней же, настройка в браузере
            на `http://<станция>:8780`. Нужен root (ADB или SSH).

            **YAM** (версия 0.2+, пакет `tangenx/wakeword`):
            ```sh
            yam --platform <yandexmidi|bergamot|...> install --yes wakeword-${{ github.ref_name }}.yampkg
            /etc/init.d/S97wakeword start
            ```
            Профили платформ — в `docs/PLATFORMS.md` репозитория YAM. Слова
            лежат в `/data/wakeword` и переживают переустановку пакета.

            **Скриптом** (ssh или adb):
            ```sh
            tar -xzf wakeword-${{ github.ref_name }}.tar.gz && cd wakeword
            STATION_IP=<ip станции> STATION_TRANSPORT=adb ./install.sh
            ```

            `negatives.bin` в пакетах — производная
            [openwakeword_features](https://huggingface.co/datasets/davidscripka/openwakeword_features),
            CC BY-NC-SA 4.0: только некоммерческое использование.
